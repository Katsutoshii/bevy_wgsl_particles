[package]
name = "bevy_wgsl_particles"
version = "0.20.0"
authors = ["Josiah Putman"]
edition = "2021"
description = "GPU particle system for the Bevy game engine"
repository = "https://github.com/katsutoshii/bevy_wgsl_particles"
documentation = "https://docs.rs/bevy_wgsl_particles"
keywords = ["bevy", "particle-system", "particles", "vfx"]
license = "MIT OR Apache-2.0"
readme = "README.md"
autoexamples = false


[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_material",
    "x11",
] }
bytemuck = "1"
rand = { version = "0.8" }
rand_pcg = { version = "0.3" }

[dev-dependencies]
bevy = { version = "0.20", default-features = true, features = [
    "file_watcher",
    "dynamic_linking",
    "picking",
] }
bevy-inspector-egui = { version = '0.38' }

[[example]]
name = "basic"

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_wgsl_particles = { path = "../bevy_wgsl_particles" }
bevy_pbr = { path = "../bevy/crates/bevy_pbr" }
bevy_render = { path = "../bevy/crates/bevy_render" }
